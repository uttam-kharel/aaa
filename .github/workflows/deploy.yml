# deploy.yml — Production + preview deploys to Vercel.
# Triggers ONLY on pushes and PRs targeting the `production` branch.
# Merging a PR into production = quality checks + migrations + live deploy.
name: Deploy to Vercel

on:
    push:
        branches: [production] # a push/merge to production deploys
    pull_request:
        branches: [production] # PRs to production get a preview deploy

concurrency:
    group: vercel-${{ github.ref }}
    cancel-in-progress: false
    # ^ Serialize deploys per branch so two merges can't race. With
    #   cancel-in-progress: false, a queued deploy runs rather than being killed.

jobs:
    quality:
        name: Quality checks
        uses: ./.github/workflows/ci.yml
        # ^ Reuse the same checks as every other push — nothing deploys
        #   until these pass.

    preview:
        name: Preview deploy (PR)
        if: github.event_name == 'pull_request'
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              # ^ Fetch the PR's code

            - name: Deploy preview to Vercel
              id: preview
              continue-on-error: true
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  OUTPUT="$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" 2>&1)"
                  URL="$(printf '%s' "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.(vercel|app)' | tail -1)"
                  echo "url=$URL" >> "$GITHUB_OUTPUT"
              # ^ Uses the OFFICIAL Vercel CLI (no third-party action) with your
              #   account's token/org/project from GitHub secrets. Deploys this PR
              #   as a preview and captures its URL into $GITHUB_OUTPUT.
              #   continue-on-error: a preview failure won't block the PR.

            - name: Comment preview URL on the PR
              if: steps.preview.outputs.url != ''
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: `🚀 Preview deployment: ${process.env.PREVIEW_URL}`,
                      });
              env:
                  PREVIEW_URL: ${{ steps.preview.outputs.url }}
              # ^ Posts the preview URL as a comment on the PR so reviewers
              #   can click straight to the deployed version.

    production:
        name: Production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              # ^ Fetch the production branch's code

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, intl, bcmath, pgsql, pdo_pgsql
                  coverage: none
                  tools: composer:v2
              # ^ PHP 8.4 with the Postgres drivers this time — migrations run
              #   against the real Vercel Postgres database.

            - name: Install PHP dependencies
              run: composer install --no-dev --no-interaction --prefer-dist --no-progress
              # ^ Production install (no dev-only packages)

            - name: Run database migrations
              env:
                  APP_ENV: production
                  DB_CONNECTION: pgsql
                  DB_URL: ${{ secrets.DB_URL }}
                  DB_SSLMODE: require
              run: php artisan migrate --force
              # ^ Apply schema changes to Vercel Postgres BEFORE the new code
              #   goes live, using the DB_URL GitHub secret (non-pooling URL).

            - name: Deploy to Vercel (production)
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
              # ^ Official CLI again, with --prod: replaces the live deployment.
